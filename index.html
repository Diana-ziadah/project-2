<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Runner 3D Game</title>
   
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            z-index: 100;
        }
        #gameOverScreen, #winScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
            text-align: center;
        }
        #gameOverScreen.show, #winScreen.show {
            display: flex;
        }
        #gameOverScreen h1, #winScreen h1 {
            font-size: 48px;
            margin: 20px;
        }
        #gameOverScreen p, #winScreen p {
            font-size: 24px;
            margin: 10px;
        }
        #gameOverScreen button, #winScreen button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #winScreen button {
            background: #51cf66;
        }
        #gameOverScreen button:hover {
            background: #ff5252;
        }
        #winScreen button:hover {
            background: #40c057;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>💰 النقاط: <span id="score">0</span></div>
        <div>📈 المستوى: <span id="level">1</span></div>
        <div>📍 المسافة: <span id="distance">0</span></div>
    </div>
    
    <div id="gameOverScreen">
        <h1>❌ انتهت اللعبة!</h1>
        <p>النقاط النهائية: <span id="finalScore">0</span></p>
        <p>المستوى: <span id="finalLevel">1</span></p>
        <button onclick="location.reload()">🔄 حاول مرة أخرى</button>
    </div>

    <div id="winScreen">
        <h1>🎉 لقد فزت! 🎉</h1>
        <p>النقاط النهائية: <span id="winScore">0</span></p>
        <p>المستوى: <span id="winLevel">1</span></p>
        <button onclick="location.reload()">🎮 العب مرة أخرى</button>
    </div>

    <div id="instructions">
        <div>⌨️ التحكم:</div>
        <div>← → للتحرك بين المسارات</div>
    </div>
<script type="module" src="./main.js"></script>
</body>
</html>
